name: Build personal Android test APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  personal-test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "21"
      - name: Locate preinstalled Android command-line tools
        id: android-tools
        shell: bash
        run: |
          for sdk_root in "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}" /usr/local/lib/android/sdk /opt/android-sdk "$HOME/.android/sdk"; do
            if [ -z "$sdk_root" ] || [ ! -d "$sdk_root/cmdline-tools" ]; then
              continue
            fi
            sdk_manager="$(find "$sdk_root/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | sort -V | tail -1)"
            if [ -n "$sdk_manager" ] && [ -x "$sdk_manager" ]; then
              printf '%s\n' "$(dirname "$sdk_manager")" >> "$GITHUB_PATH"
              printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$sdk_root" "$sdk_root" >> "$GITHUB_ENV"
              echo 'available=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo 'available=false' >> "$GITHUB_OUTPUT"
      - name: Set up Android tools when not preinstalled
        if: steps.android-tools.outputs.available != 'true'
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: "12266719"
          packages: platform-tools
          log-accepted-android-sdk-licenses: "false"
      - name: Verify source and build offline assets
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: |
          npm ci
          npm run check
          npm test
          python3 -m unittest discover -s tests/python -p test_android_test_artifact.py
          npm run android:sync
      - name: Build isolated test installation without repository secrets
        working-directory: android
        run: |
          sdkmanager --version
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          chmod +x gradlew
          ./gradlew assemblePersonalTest --no-daemon
      - name: Verify signature, identity and every bundled web file
        shell: bash
        run: |
          test_apk="android/app/build/outputs/apk/personalTest/app-personalTest.apk"
          signing_tool="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$signing_tool"
          mkdir -p android-test-evidence
          "$signing_tool" verify --verbose --print-certs "$test_apk" > android-test-evidence/signature.txt
          "$(dirname "$signing_tool")/aapt" dump badging "$test_apk" > android-test-evidence/badging.txt
          python3 scripts/verify-android-test.py \
            --apk "$test_apk" --dist dist \
            --signature android-test-evidence/signature.txt \
            --badging android-test-evidence/badging.txt \
            --commit "$GITHUB_SHA" --output android-test-evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: YKSMania-Android-personal-test
          if-no-files-found: error
          retention-days: 30
          path: android-test-evidence/
