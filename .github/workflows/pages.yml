name: Publish GitHub Pages
on:
  workflow_run:
    workflows: [Verify and build packages]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    timeout-minutes: 20
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_sha == github.sha &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Require current main and complete CI
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_SOURCE: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: bash scripts/require-pages-ci.sh "$PAGES_SOURCE"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npm run check && npm test && npm run build
        env:
          YKSMANIA_BASE_PATH: /yksmania/
      - name: Install Chromium for Playwright (retries transient mirror failures)
        run: |
          for attempt in 1 2 3; do
            npx playwright install --with-deps chromium && exit 0
            echo "Playwright install attempt $attempt failed; retrying"
            sleep $((attempt * 20))
          done
          exit 1
      - run: node scripts/test-pages.mjs
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Recheck main before deployment
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_SOURCE: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: test "$(gh api repositories/1456066977/git/ref/heads/main --jq .object.sha)" = "$PAGES_SOURCE"
      - name: Publish tested project build
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
  verify-published:
    timeout-minutes: 15
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Install Chromium for Playwright (retries transient mirror failures)
        run: |
          for attempt in 1 2 3; do
            npx playwright install --with-deps chromium && exit 0
            echo "Playwright install attempt $attempt failed; retrying"
            sleep $((attempt * 20))
          done
          exit 1
      - run: node scripts/test-pages.mjs
        env:
          YKSMANIA_PAGES_URL: ${{ needs.deploy.outputs.page_url }}
          YKSMANIA_EVIDENCE_DIR: pages-evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: published-pages-evidence
          path: pages-evidence/
