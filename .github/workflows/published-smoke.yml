name: Published web acceptance
on:
  workflow_dispatch:
    inputs:
      url:
        description: Published YKSMania address to verify
        required: true
        type: choice
        default: https://kaansavukduran.github.io/yksmania/
        options:
          - https://kaansavukduran.github.io/yksmania/
          - https://yksmania.pages.dev/
permissions:
  contents: read
jobs:
  published-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Install Chromium for Playwright (retries transient mirror failures)
        run: |
          for attempt in 1 2 3; do
            npx playwright install --with-deps chromium && exit 0
            echo "Playwright install attempt $attempt failed; retrying"
            sleep $((attempt * 20))
          done
          exit 1
      - name: Verify GitHub Pages and its project path
        if: inputs.url == 'https://kaansavukduran.github.io/yksmania/'
        run: node scripts/test-pages.mjs
        env:
          YKSMANIA_PAGES_URL: ${{ inputs.url }}
          YKSMANIA_EVIDENCE_DIR: published-pages-evidence
      - name: Verify Cloudflare Pages
        if: inputs.url == 'https://yksmania.pages.dev/'
        run: npm run test:e2e -- --workers=2 --trace retain-on-failure
        env:
          BASE_URL: ${{ inputs.url }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: published-browser-evidence
          path: |
            published-pages-evidence/
            playwright-report/
