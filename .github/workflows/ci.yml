name: Verify published Pages recovery
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: published-pages-recovery-033
  cancel-in-progress: false
jobs:
  verify-published:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - name: Prove frozen production inputs
        run: |
          git fetch origin 197dc1b31c0a45ad03a3782106665591cc0c32fc --depth=1
          git diff --exit-code 197dc1b31c0a45ad03a3782106665591cc0c32fc HEAD -- src public desktop android index.html vite.config.ts package.json package-lock.json
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npx playwright install --with-deps chromium
      - name: Verify existing deployment without publishing
        run: node scripts/test-pages.mjs
        env:
          YKSMANIA_PAGES_URL: https://kaansavukduran.github.io/yksmania/
          YKSMANIA_EVIDENCE_DIR: pages-recovery-evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: published-pages-recovery-033-evidence
          path: pages-recovery-evidence/
