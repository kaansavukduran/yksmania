name: Publish verified alpha packages
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Successful Verify and build packages run ID
        required: true
      include_android:
        description: Include the APK verified with the configured persistent signing key
        type: boolean
        required: false
        default: false
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: kaansavukduran/yksmania
      BUILD_RUN: ${{ inputs.build_run }}
      RELEASE_VERSION: "0.197.0"
      ANDROID_VERSION_CODE: "208"
      INCLUDE_ANDROID: ${{ inputs.include_android }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Require a fully successful main build
        shell: bash
        run: |
          [[ "$BUILD_RUN" =~ ^[0-9]+$ ]]
          gh run view "$BUILD_RUN" --json status,conclusion,headSha,headBranch,name > verified-run.json
          python3 - <<'PY'
          import json, os, re
          r = json.load(open('verified-run.json'))
          assert r['status'] == 'completed' and r['conclusion'] == 'success', r
          assert r['headBranch'] == 'main' and r['name'] == 'Verify and build packages', r
          assert re.fullmatch(r'[0-9a-f]{40}', r['headSha']), 'Invalid verified commit SHA'
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('VERIFIED_SHA=' + r['headSha'] + '\n')
          PY
      - name: Require release versions at the verified commit
        shell: bash
        run: |
          gh api --method GET "repos/$GH_REPO/contents/package.json?ref=$VERIFIED_SHA" > verified-package-content.json
          gh api --method GET "repos/$GH_REPO/contents/android/app/build.gradle?ref=$VERIFIED_SHA" > verified-android-content.json
          python3 - <<'PY'
          import base64, json, os, re
          def source(filename, path):
              item = json.load(open(filename))
              assert item['type'] == 'file' and item['path'] == path and item['encoding'] == 'base64', 'Unexpected source response'
              return base64.b64decode(''.join(item['content'].splitlines()), validate=True).decode('utf-8')
          version = os.environ['RELEASE_VERSION']
          code = os.environ['ANDROID_VERSION_CODE']
          package = json.loads(source('verified-package-content.json', 'package.json'))
          assert package['version'] == version, 'Verified commit has a different package version'
          android = source('verified-android-content.json', 'android/app/build.gradle')
          assert re.findall(r'^\s*versionName\s+"([^"]+)"\s*$', android, re.MULTILINE) == [version], 'Verified commit has a different Android versionName'
          assert re.findall(r'^\s*versionCode\s+(\d+)\s*$', android, re.MULTILINE) == [code], 'Verified commit has a different Android versionCode'
          PY
      - name: Collect packages without rebuilding
        run: |
          gh run download "$BUILD_RUN" --dir packages
          python3 - <<'PY'
          from pathlib import Path
          import shutil, hashlib, os, re
          version = os.environ['RELEASE_VERSION']
          code = os.environ['ANDROID_VERSION_CODE']
          assert os.environ['INCLUDE_ANDROID'] in ('true', 'false'), 'Explicit Android publication scope required'
          include_android = os.environ['INCLUDE_ANDROID'] == 'true'
          files = [p for p in Path('packages').rglob('*') if p.suffix in ('.exe', '.AppImage', '.deb', '.apk')]
          expected = [
              f'YKSMania-{version}-Windows-x64-Setup.exe',
              f'YKSMania-{version}-Windows-x64-Portable.exe',
              f'YKSMania-{version}-Linux-x86_64.AppImage',
              f'YKSMania-{version}-Linux-amd64.deb',
          ]
          if include_android:
              expected.append('app-debug.apk')
          assert sorted(p.name for p in files) == sorted(expected), 'Release artifact names or versions do not match'
          evidence = list(Path('packages').rglob('verification.txt'))
          assert len(evidence) == int(include_android), 'Android evidence does not match the explicit publication scope'
          if include_android:
              android = evidence[0].read_text()
              package = re.findall(r"^package: name='([^']+)' versionCode='(\d+)' versionName='([^']+)'", android, re.MULTILINE)
              assert package == [('com.fragaria.yksmania', code, version)], 'Android artifact package/version metadata does not match'
          out = Path('release-files')
          out.mkdir()
          for p in files:
              name = f'YKSMania-{version}-Android-debug.apk' if p.suffix == '.apk' else p.name
              shutil.copyfile(p, out / name)
          if include_android:
              shutil.copyfile(evidence[0], out / 'Android-verification.txt')
          shutil.copyfile('verified-run.json', out / 'verified-run.json')
          with (out / 'SHA256SUMS.txt').open('w') as f:
              for p in sorted(out.iterdir()):
                  if p.name != 'SHA256SUMS.txt':
                      f.write(hashlib.file_digest(p.open('rb'), 'sha256').hexdigest() + '  ' + p.name + '\n')
          PY
      - name: Require the pinned Android certificate
        if: inputs.include_android
        run: node scripts/prepare-android-signing.mjs --verify release-files/Android-verification.txt
      - name: Publish verified prerelease
        run: |
          release_tag="v${RELEASE_VERSION}-alpha.1"
          gh release create "$release_tag" --target "$VERIFIED_SHA" --title "ÖSYM Mania ${RELEASE_VERSION} alpha 1" --draft --prerelease --notes-file docs/RELEASE_ALPHA.md
          gh release upload "$release_tag" release-files/*
          gh release edit "$release_tag" --draft=false --prerelease=true --latest=false
